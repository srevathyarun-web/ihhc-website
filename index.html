<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Winding Up Notice</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #e6f4ea;
      margin: 0;
      padding: 0;
      color: #222;
      text-align: center;
    }

    header {
      background-color: #006b3c;
      color: white;
      padding: 1.2rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    main {
      padding: 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    main p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    .highlight {
      color: #006b3c;
      font-weight: bold;
    }

    .image-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .image-container img {
      width: 45%;
      max-width: 500px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    footer {
      background-color: #006b3c;
      color: white;
      padding: 1rem;
      font-size: 0.95rem;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .image-container img {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>Public Notice – Winding Up Proceedings</header>

  <main>
      <p><b>India Home Health Care Private Limited</b> has been ordered to be wound up by the Hon’ble NCLT, Chennai Bench, vide order dated 26.11.2025, under the Companies Act, 2013. 
    A copy of the Notice of Winding Up Order is enclosed for public information.</p>

    <div class="image-container">
      <img src="image3.png" alt="Advertisement Copy 1">
      <img src="image4.png" alt="Advertisement Copy 2">
    </div>
  </main>

  <footer>
    
  </footer>
</body>
</html>
